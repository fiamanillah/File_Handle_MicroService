server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;
    gzip_min_length 1000;

    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    location / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # Security headers
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "no-referrer-when-downgrade";

        # Cache control for HTML files
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Static files caching
    location ~* \.(?:jpg|jpeg|png|gif|ico|webp|svg|mp4|webm|ogg|mp3|wav|pdf|zip|rar|gz|tar|doc|xls|ppt)$ {
        access_log off;
        log_not_found off;

        # Long cache for static assets
        expires 365d;
        add_header Cache-Control "public, immutable";

        # Enable sendfile for direct file transfers
        sendfile on;
        tcp_nopush on;

        # Try to serve file directly, fallback to 404
        try_files $uri =404;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /404.html {
        internal;
    }
    location = /50x.html {
        internal;
    }

    # File download rate limiting (optional)
    # limit_rate_after 10m;
    # limit_rate 2m;

    # Client body size limit (adjust as needed)
    # client_max_body_size 100M;
}